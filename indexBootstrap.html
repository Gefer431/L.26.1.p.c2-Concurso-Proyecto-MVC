<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concurso - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div id="app-Bootstrap" class="container mt-5">
    <h2>Gestión del Concurso (Bootstrap)</h2>
    <div>
      <button type="button" class="btn btn-primary me-2" id="concurso_btNuevoAspirante">Nuevo Aspirante</button>
      <button type="button" class="btn btn-danger" id="concurso_btTerminar">Terminar Concurso</button>
    </div>
    <hr>
    <div class="alert alert-info">
    Mejor aspirante hasta ahora: <span id="concurso_lblMejor" class="fw-bold">(ninguno)</span><br>
    Promedio de edad: <span id="concurso_lblPromEdad" class="fw-bold">0.0</span> años
</div>
<div class="alert alert-success">
    Resultado final: <span id="concurso_lblFinal" class="fw-bold"></span><br>
    Promedio de edad final: <span id="concurso_lblPromFinal" class="fw-bold">0.0</span> años
</div>

    <h4>Listado de aspirantes</h4>
    <table class="table table-bordered">
      <thead>
        <tr><th>Nombre</th><th>Apellido</th><th>Puntaje total</th></tr>
      </thead>
      <tbody id="tabla-aspirantes-body"></tbody>
    </table>
  </div>

  
  <div class="modal fade" id="aspirante" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Aspirante</h5>
        </div>
        <div class="modal-body">
          <label class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="aspirante_inNombre">
          <label class="form-label">Apellido:</label>
          <label class="form-label">Cédula:</label>
          <input type="text" class="form-control" id="aspirante_inCedula">
          <input type="text" class="form-control" id="aspirante_inApellido">
          <label class="form-label">Sexo (M/F):</label>
          <input type="text" class="form-control" id="aspirante_inSexo" maxlength="1">
          <label class="form-label">Fecha Nacimiento (aaaa-mm-dd):</label>
          <input type="date" class="form-control" id="aspirante_inFechaNac">
          <label class="form-label">Puntos Académicos (máx 25):</label>
          <input type="number" class="form-control" id="aspirante_inPuntosAcad" min="0" max="25">
          <label class="form-label">Puntos Preparador (máx 15):</label>
          <input type="number" class="form-control" id="aspirante_inPuntosPrep" min="0" max="15">
          <label class="form-label">Puntos Diplomas (máx 10):</label>
          <input type="number" class="form-control" id="aspirante_inPuntosDip" min="0" max="10">
          <div id="mensaje" class="text-danger mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="aspirante_btCancelar">Cancelar</button>
          <button type="button" class="btn btn-success" id="aspirante_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import Cl_cConcurso from "./dist/controllers/Cl_cConcurso.js";
    import Cl_vConcursoBootstrap from "./dist/views/Cl_vConcursoBootstrap.js";
    import Cl_vAspiranteBootstrap from "./dist/views/Cl_vAspiranteBootstrap.js";

    const vistaConcurso = new Cl_vConcursoBootstrap();
    const vistaAspirante = new Cl_vAspiranteBootstrap();
    new Cl_cConcurso(vistaConcurso, vistaAspirante);
  </script>
</body>
</html>
